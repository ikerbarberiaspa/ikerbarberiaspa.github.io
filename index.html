
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IKER BARBERÍA SPA. Próximamente nuestra página web oficial.">
  <title>IKER BARBERÍA SPA | Próximamente</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #29251c, #090909 75%);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .contenedor {
      max-width: 750px;
      animation: aparecer 1.5s ease;
    }

    .icono {
      font-size: 55px;
      margin-bottom: 25px;
    }

    h1 {
      color: #d4af37;
      font-size: clamp(32px, 7vw, 60px);
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .linea {
      width: 100px;
      height: 3px;
      background: #d4af37;
      margin: 25px auto;
    }

    h2 {
      font-size: clamp(22px, 5vw, 35px);
      letter-spacing: 5px;
      margin-bottom: 25px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      color: #c9c9c9;
    }

    .mensaje {
      margin-top: 30px;
      color: #d4af37;
      font-weight: bold;
      letter-spacing: 2px;
    }

    footer {
      margin-top: 65px;
      font-size: 13px;
      color: #888;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main class="contenedor">

    <div class="icono">✂️</div>

    <h1>IKER BARBERÍA SPA</h1>

    <div class="linea"></div>

    <h2>PRÓXIMAMENTE</h2>

    <p>
      Estamos preparando una nueva experiencia
      en estilo, belleza y cuidado personal.
    </p>

    <p class="mensaje">
      NUESTRA WEB ESTÁ EN CONSTRUCCIÓN
    </p>

    <footer>
      © 2026 IKER BARBERÍA SPA.
      Todos los derechos reservados.
    </footer>

  </main>
</body>
</html>
