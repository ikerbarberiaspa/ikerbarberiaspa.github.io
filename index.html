
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Muy pronto la página web oficial de IKER BARBERÍA SPA.">
  <title>IKER BARBERÍA SPA | Próximamente nuestra web</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle, #29251c, #090909 80%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .contenedor {
      max-width: 750px;
      animation: aparecer 1.5s ease;
    }

    .icono {
      font-size: 55px;
      margin-bottom: 25px;
    }

    h1 {
      color: #d4af37;
      font-size: clamp(30px, 6vw, 58px);
      letter-spacing: 3px;
    }

    .linea {
      width: 100px;
      height: 3px;
      background: #d4af37;
      margin: 30px auto;
    }

    h2 {
      font-size: clamp(22px, 4vw, 34px);
      margin-bottom: 25px;
      line-height: 1.4;
    }

    p {
      color: #cccccc;
      font-size: 18px;
      line-height: 1.8;
    }

    .mensaje {
      color: #d4af37;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-top: 35px;
    }

    footer {
      margin-top: 70px;
      color: #888;
      font-size: 13px;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main class="contenedor">

    <div class="icono">✂️</div>

    <h1>IKER BARBERÍA SPA</h1>

    <div class="linea"></div>

    <h2>¡MUY PRONTO NUESTRA PÁGINA WEB!</h2>

    <p>
      Estamos preparando un espacio digital
      donde podrás descubrir nuestros servicios,
      novedades y mucho más.
    </p>

    <div class="mensaje">¡ESPÉRANOS!</div>

    <footer>
      © 2026 IKER BARBERÍA SPA.
      Todos los derechos reservados.
    </footer>

  </main>
</body>
</html>


  </main>
</body>
</html>
